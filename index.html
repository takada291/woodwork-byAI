<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI木工</title>
    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
      }
    </script>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WXBP6CPKLP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // ここも測定IDに書き換えます
      gtag('config', 'G-WXBP6CPKLP');
    </script>
    
    <style>
        :root {
            --wood-color: #d4a373;
            --wood-dark: #8c5e3c;
            --bg-color: #fdfcf0;
            --accent: #2e8b57;
        }
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        h1 {
            color: var(--wood-dark);
            text-align: center;
            border-bottom: 3px solid var(--wood-color);
            padding-bottom: 10px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-row {
            display: flex;
            gap: 15px;
        }
        .input-row > div {
            flex: 1;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--wood-dark);
            font-size: 0.9rem;
        }
        input[type="number"], input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn-generate {
            width: 100%;
            padding: 15px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .btn-generate:hover {
            background-color: #256d44;
        }
        .btn-generate:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #result-area {
            display: none;
            margin-top: 30px;
            border-top: 2px dashed var(--wood-color);
            padding-top: 20px;
        }
        .blueprint-card {
            background: #fff;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
        }
        .project-title {
            font-size: 1.5rem;
            color: var(--accent);
            margin-top: 0;
        }
        .svg-container {
            text-align: center;
            margin: 20px 0;
            background: #fff;
            padding: 20px;
            border: 1px solid #eee;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .svg-container svg {
            max-width: 100%;
            height: auto;
            max-height: 350px;
            filter: drop-shadow(5px 5px 5px rgba(0,0,0,0.1));
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: var(--wood-color);
            color: white;
        }
        #layout-canvas {
            width: 100%;
            border: 2px solid #333;
            background-color: #f0e6d2;
            margin-top: 20px;
        }
        .loading {
            text-align: center;
            font-weight: bold;
            color: var(--accent);
            display: none;
            margin-top: 20px;
        }
        .api-note {
            font-size: 0.8rem;
            color: #666;
            background: #eee;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .status-log {
            font-size: 0.8rem;
            color: #666;
            margin-top: 5px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI木工 v0.3</h1>
        <p>作りたいもの・木材の寸法を入力すると’AI親方’が3Dイメージ図・木取り図のラフ案を作成します！</p>

        <div class="api-note">
            <strong>⚠️ APIキーが必要です</strong><br>
            Google Gemini APIキーを入力してください。他の人と共有しないでください。
            <br>→<a href="https://j-aic.com/techblog/google-ai-studio-api-free-202511" target="_blank" rel="noopener noreferrer">こちらのサイトがわかりやすいです。</a>
        </div>

        <div class="input-group">
            <label>Gemini APIキー</label>
            <input type="password" id="api-key" placeholder="AIzaSy...">
        </div>

        <div class="input-group">
            <label>作りたいもの（例：子供用の本棚、しっかりした踏み台etc.）</label>
            <input type="text" id="user-topic" placeholder="例：子供用の本棚">
        </div>

        <div class="input-row">
            <div class="input-group">
                <label>木材の厚み (mm)</label>
                <input type="number" id="board-d" value="12" placeholder="例: 12, 24, 38">
            </div>
            <div class="input-group" style="visibility: hidden;"></div>
        </div>

        <div class="input-row">
            <div class="input-group">
                <label>木材の幅/長さ (mm)</label>
                <input type="number" id="board-w" value="1820" placeholder="長い方の寸法">
            </div>
            <div class="input-group">
                <label>木材の高さ/巾 (mm)</label>
                <input type="number" id="board-h" value="910" placeholder="短い方の寸法">
            </div>
        </div>
        
        <button class="btn-generate" id="btn-run">AI親方に相談する 🪄</button>
        
        <div class="loading" id="loading-msg">
            🔨 AI親方が設計中（時間がかかるよ！）...<br>
            <span id="loading-detail" class="status-log">準備中...</span>
        </div>

        <div id="result-area">
            <div class="blueprint-card">
                <h2 class="project-title" id="out-title"></h2>
                <p id="out-desc"></p>
                
                <h3>📷 完成イメージ（3D鳥観図）</h3>
                <div class="svg-container" id="out-svg"></div>

                <h3>📋 部材リスト</h3>
                <table id="parts-table">
                    <thead>
                        <tr>
                            <th>部品名</th>
                            <th>幅(mm)</th>
                            <th>高さ(mm)</th>
                            <th>枚数</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>

                <h3>📐 簡易木取り図</h3>
                <p style="font-size:0.9rem;">※赤線はカットラインの目安です。’板の木取’アプリで木取りが正確かチェックしてください！</p>
                <canvas id="layout-canvas"></canvas>
            </div>
        </div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        const btn = document.getElementById('btn-run');
        const loading = document.getElementById('loading-msg');
        const loadingDetail = document.getElementById('loading-detail');
        const resultArea = document.getElementById('result-area');
        const apiKeyInput = document.getElementById('api-key');
        
        const topicInput = document.getElementById('user-topic');
        const depthInput = document.getElementById('board-d');

        const savedKey = localStorage.getItem('gemini_api_key');
        if(savedKey) apiKeyInput.value = savedKey;

        // モデル自動検出（安定版）
        async function findAvailableModel(apiKey) {
            try {
                loadingDetail.innerText = "最適なAIモデルを探しています...";
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
                if (!response.ok) throw new Error("モデルリストの取得に失敗しました");
                
                const data = await response.json();
                const models = data.models || [];

                const capableModels = models.filter(m => 
                    m.supportedGenerationMethods && 
                    m.supportedGenerationMethods.includes("generateContent") &&
                    !m.name.includes("gemini-2.0") 
                );

                let bestModel = capableModels.find(m => m.name.includes("gemini-1.5-flash"));
                if (!bestModel) bestModel = capableModels.find(m => m.name.includes("gemini-1.5-pro"));
                if (!bestModel && capableModels.length > 0) bestModel = capableModels[0];

                if (bestModel) return bestModel.name.replace("models/", "");
                return "gemini-1.5-flash";
            } catch (e) {
                console.warn("モデル自動検出失敗:", e);
                return "gemini-1.5-flash"; 
            }
        }

        btn.addEventListener('click', async () => {
            const apiKey = apiKeyInput.value.trim();
            const boardW = parseInt(document.getElementById('board-w').value);
            const boardH = parseInt(document.getElementById('board-h').value);
            const boardD = parseInt(depthInput.value) || 12;
            const userTopic = topicInput.value.trim() || "実用的でシンプルな木工作品";
            
            if(!apiKey) {
                alert('APIキーを入力してください');
                return;
            }
            localStorage.setItem('gemini_api_key', apiKey);

            btn.disabled = true;
            loading.style.display = 'block';
            resultArea.style.display = 'none';

            try {
                const modelName = await findAvailableModel(apiKey);
                loadingDetail.innerText = `AI親方が「${userTopic}」を考案中...(${modelName})`;

                // ★ここを修正：SVG内でのダブルクォート使用を禁止する指示を追加
                const prompt = `
                    あなたは熟練の木工職人です。
                    ユーザーの手元に【幅${boardW}mm × 高さ${boardH}mm × 厚み${boardD}mm】の材料（板材または角材）が1つあります。
                    この材料から切り出せる、「${userTopic}」を考案してください。
                    
                    【条件】
                    - 複雑な曲線カットは無し。直線カットのみ。
                    - 部材の合計面積（長さ）が、材料の90%以下になるようにすること。
                    - 出力は必ず以下のJSON形式のみで行うこと（Markdown記法は不要）。
                    
                    【重要：SVG作成のルール】
                    - JSONエラーを防ぐため、SVGコード内の属性は『必ずシングルクォート(')』を使用し、ダブルクォート(")は絶対に使用しないこと。
                    - 例：<svg viewBox='0 0 100 100' ...>
                    - 作品の完成形をイメージした『3Dのアイソメトリック図（鳥観図）』を描くこと。
                    - 立体感がわかるように面ごとに色（茶色の濃淡 #8c5e3c, #d4a373など）を変えて塗りつぶすこと。
                    
                    【JSONフォーマット】
                    {
                        "title": "作品名",
                        "description": "どんな作品か簡潔な説明（30文字程度）",
                        "svg_icon": "<svg viewBox='0 0 200 200'>...</svg>",
                        "parts": [
                            {"name": "脚", "w": 450, "h": 40, "count": 4},
                            {"name": "座面", "w": 300, "h": 300, "count": 1}
                        ]
                    }
                `;

                const genAI = new GoogleGenerativeAI(apiKey);
                const model = genAI.getGenerativeModel({ model: modelName });

                const result = await model.generateContent(prompt);
                const response = await result.response;
                let text = response.text();

                // 余計な記号を削除
                text = text.replace(/```json/g, '').replace(/```/g, '').trim();
                
                // パース実行
                const data = JSON.parse(text);

                document.getElementById('out-title').innerText = data.title;
                document.getElementById('out-desc').innerText = data.description;
                document.getElementById('out-svg').innerHTML = data.svg_icon;

                const tbody = document.querySelector('#parts-table tbody');
                tbody.innerHTML = '';
                let allParts = [];

                data.parts.forEach(part => {
                    const row = `<tr>
                        <td>${part.name}</td>
                        <td>${part.w}</td>
                        <td>${part.h}</td>
                        <td>${part.count}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                    
                    for(let i=0; i<part.count; i++){
                        let fw = part.w, fh = part.h;
                        if (boardW > boardH) {
                             if (fw > fh) { [fw, fh] = [fh, fw]; }
                        } else {
                             if (fh > fw) { [fw, fh] = [fh, fw]; }
                        }
                        allParts.push({ w: fw, h: fh, name: part.name });
                    }
                });

                resultArea.style.display = 'block';
                drawLayout(boardW, boardH, allParts);
                
            } catch (error) {
                console.error(error);
                // エラー内容を少し優しく表示
                if(error.message.includes("JSON")) {
                     alert('AI親方が図面の書き方を間違えました（JSONエラー）。\nもう一度ボタンを押してみてください！');
                } else {
                     alert('エラーが発生しました: ' + error.message);
                }
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        });

        function drawLayout(boardW, boardH, parts) {
            const canvas = document.getElementById('layout-canvas');
            if(canvas.parentElement && canvas.parentElement.clientWidth){
                const maxDisplayWidth = canvas.parentElement.clientWidth;
                let renderW = boardW;
                let renderH = boardH;
                const scale = maxDisplayWidth / renderW;
                
                canvas.width = renderW * scale;
                canvas.height = Math.max(renderH * scale, 50);
                
                const ctx = canvas.getContext('2d');
                ctx.scale(scale, scale);

                ctx.fillStyle = '#f0e6d2';
                ctx.fillRect(0, 0, renderW, renderH);
                ctx.strokeStyle = '#8c5e3c';
                ctx.lineWidth = 2 / scale;
                ctx.strokeRect(0, 0, renderW, renderH);

                parts.sort((a, b) => b.h - a.h); 

                let currentX = 0;
                let currentY = 0;
                let rowMaxH = 0;
                const KERF = 5;

                ctx.font = `${14 / scale}px Arial`;
                ctx.strokeStyle = '#c0392b'; 
                ctx.lineWidth = 2 / scale;

                parts.forEach(part => {
                    if (currentX + part.w > renderW) {
                        currentX = 0;
                        currentY += rowMaxH + KERF;
                        rowMaxH = 0;
                    }
                    if (currentY + part.h > renderH) {
                        return; 
                    }
                    
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(currentX, currentY, part.w, part.h);
                    ctx.strokeRect(currentX, currentY, part.w, part.h);
                    
                    ctx.fillStyle = '#333';
                    if(part.w * scale > 20 && part.h * scale > 10) {
                        ctx.fillText(part.name, currentX + 5, currentY + (part.h/2) + 4);
                    }

                    currentX += part.w + KERF;
                    if (part.h > rowMaxH) rowMaxH = part.h;
                });
            }
        }
    </script>
</body>
</html>
