<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI木工</title>
    
    <!-- アクセス解析 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WXBP6CPKLP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WXBP6CPKLP');
    </script>
    
    <style>
        :root {
            --wood-color: #d4a373;
            --wood-dark: #8c5e3c;
            --bg-color: #fdfcf0;
            --accent: #2e8b57;
        }
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        h1 {
            color: var(--wood-dark);
            text-align: center;
            border-bottom: 3px solid var(--wood-color);
            padding-bottom: 10px;
            margin-top: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-row {
            display: flex;
            gap: 15px;
        }
        .input-row > div {
            flex: 1;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--wood-dark);
            font-size: 0.9rem;
        }
        input[type="number"], input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn-generate {
            width: 100%;
            padding: 15px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .btn-generate:hover {
            background-color: #256d44;
        }
        .btn-generate:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        
        /* 提案書出力ボタングループ */
        #export-buttons {
            display: none; gap: 8px; margin-top: 20px; margin-bottom: 10px;
        }
        .btn-export-pdf { flex: 1; background-color: #e74c3c; padding: 12px; font-size: 14px; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-export-pdf:hover { background-color: #c0392b; }
        .btn-export-word { flex: 1; background-color: #2b579a; padding: 12px; font-size: 14px; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-export-word:hover { background-color: #1e3f72; }

        #result-area {
            display: none;
            margin-top: 30px;
            border-top: 2px dashed var(--wood-color);
            padding-top: 20px;
        }
        .blueprint-card {
            background: #fff;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
        }
        .project-title {
            font-size: 1.5rem;
            color: var(--accent);
            margin-top: 0;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 5px;
        }
        .svg-container {
            text-align: center;
            margin: 20px 0;
            background: #fff;
            padding: 20px;
            border: 1px solid #eee;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .svg-container svg {
            max-width: 100%;
            height: auto;
            max-height: 350px;
            filter: drop-shadow(5px 5px 5px rgba(0,0,0,0.1));
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: var(--wood-color);
            color: white;
        }
        #layout-canvas {
            width: 100%;
            border: 2px solid #333;
            background-color: #f0e6d2;
            margin-top: 10px;
        }
        .loading {
            text-align: center;
            font-weight: bold;
            color: var(--accent);
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #e8f5e9;
            border-radius: 8px;
        }
        .api-note {
            font-size: 0.8rem;
            color: #666;
            background: #eee;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .model-badge {
            display: inline-block; padding: 2px 8px; font-size: 11px; font-weight: bold;
            color: #fff; background-color: #8e44ad; border-radius: 4px; margin-bottom: 15px;
        }

        /* 印刷（PDF出力）用の設定 */
        @media print {
            @page { size: A4 portrait; margin: 15mm; }
            body { background: #fff; }
            .api-note, .input-group, .input-row, .btn-generate, #export-buttons, #loading-msg { display: none !important; }
            h1 { display: none; }
            .container { box-shadow: none; padding: 0; max-width: 100%; border: none; }
            .blueprint-card { border: none; padding: 0; }
            .svg-container { border: none; padding: 0; }
            #layout-canvas { border: 1px solid #333; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI木工 v1.1</h1>
        <p>作りたいものと材料を入力すると、AIが3Dイメージ図と木取り図を自動設計します。</p>

        <div class="api-note">
            <strong>⚠️ APIキーが必要です</strong><br>
            Google Gemini APIキーを入力してください（ブラウザ内にのみ保存されます）。<br>
            →<a href="https://note.com/kazu_t/n/n9adffe09bd6b" target="_blank" rel="noopener noreferrer">こちらのサイトがわかりやすいです。</a>
        </div>

        <div class="input-group">
            <label>Gemini APIキー</label>
            <input type="password" id="api-key" placeholder="AIzaSy...">
        </div>

        <div class="input-group">
            <label>作りたいもの（例：子供用の椅子、本棚、キャンプ用テーブル）</label>
            <input type="text" id="user-topic" placeholder="例：頑丈な踏み台">
        </div>

        <div class="input-row">
            <div class="input-group">
                <label>材料の厚み (mm)</label>
                <input type="number" id="board-d" value="12" placeholder="例: 12, 24, 38">
            </div>
            <div class="input-group" style="visibility: hidden;"></div>
        </div>

        <div class="input-row">
            <div class="input-group">
                <label>材料の幅/長さ (mm)</label>
                <input type="number" id="board-w" value="1820" placeholder="長い方の寸法">
            </div>
            <div class="input-group">
                <label>材料の高さ/巾 (mm)</label>
                <input type="number" id="board-h" value="910" placeholder="短い方の寸法">
            </div>
        </div>
        
        <button class="btn-generate" id="btn-run">AI親方に設計を依頼する 🪄</button>
        
        <div class="loading" id="loading-msg">
            🔨 AI親方が寸法を計算中...<br>
            <span id="loading-detail" style="font-size: 0.9em; color: #555; display: block; margin-top: 5px;">準備中...</span>
        </div>

        <div id="export-buttons">
            <button class="btn-export-pdf" onclick="window.print()">🖨️ PDF保存 / 印刷</button>
            <button class="btn-export-word" onclick="exportToWord()">📝 Word出力 (.doc)</button>
        </div>

        <div id="result-area">
            <div class="blueprint-card">
                <h2 class="project-title" id="out-title"></h2>
                <div id="model-info"></div>
                <p id="out-desc" style="font-size: 1.1rem; font-weight: bold;"></p>
                
                <h3 style="color: var(--wood-dark); border-left: 4px solid var(--accent); padding-left: 8px;">📷 完成イメージ（3D鳥観図）</h3>
                <div class="svg-container" id="out-svg"></div>

                <h3 style="color: var(--wood-dark); border-left: 4px solid var(--accent); padding-left: 8px;">📋 部材リスト</h3>
                <table id="parts-table">
                    <thead>
                        <tr>
                            <th>部品名</th>
                            <th>幅(mm)</th>
                            <th>高さ(mm)</th>
                            <th>枚数</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>

                <h3 style="color: var(--wood-dark); border-left: 4px solid var(--accent); padding-left: 8px;">📐 簡易木取り図</h3>
                <p style="font-size:0.85rem; color: #555;">※赤線はカットラインの目安です。正確なネスティングは「板の木取」アプリをご活用ください。</p>
                <canvas id="layout-canvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        const btn = document.getElementById('btn-run');
        const loading = document.getElementById('loading-msg');
        const loadingDetail = document.getElementById('loading-detail');
        const resultArea = document.getElementById('result-area');
        const exportBtns = document.getElementById('export-buttons');
        const apiKeyInput = document.getElementById('api-key');
        
        const topicInput = document.getElementById('user-topic');
        const depthInput = document.getElementById('board-d');

        const savedKey = localStorage.getItem('gemini_api_key_wood');
        if(savedKey) apiKeyInput.value = savedKey;

        // ★修正: 最新モデル 3.6-flash を最優先とし、フォールバックとして 2.5-flash を指定
        const MODEL_CANDIDATES = ["gemini-3.6-flash", "gemini-2.5-flash"];
        let lastUsedModel = "";

        async function fetchWithTimeout(url, options, timeoutMs = 45000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try { return await fetch(url, { ...options, signal: controller.signal }); } 
            finally { clearTimeout(timer); }
        }

        async function callGeminiWithFallback(apiKey, basePayload) {
            let lastErrorMsg = "";
            for (const modelName of MODEL_CANDIDATES) {
                loadingDetail.innerText = `モデル [${modelName}] に打診中...`;
                
                // 3.x系の場合は思考プロセス（thinkingConfig）の設定を調整
                const isGemini3 = modelName.startsWith("gemini-3");
                const payloadWithThinking = JSON.parse(JSON.stringify(basePayload));
                
                if (isGemini3) {
                    payloadWithThinking.generationConfig = {
                        ...(payloadWithThinking.generationConfig || {}),
                        thinkingConfig: { thinkingLevel: "LOW" }
                    };
                }

                try {
                    let response = await fetchWithTimeout(
                        `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`,
                        { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payloadWithThinking) },
                        45000
                    );
                    let data = await response.json();
                    
                    // 3.x系で400エラー(Thinking非対応等)が出た場合は、thinkingConfigを外して再試行
                    if (data.error && response.status === 400 && isGemini3) {
                        response = await fetchWithTimeout(
                            `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`,
                            { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(basePayload) },
                            45000
                        );
                        data = await response.json();
                    }

                    if (data.error) {
                        lastErrorMsg = `[${modelName}] ${data.error.message}`;
                        continue;
                    }

                    if (data.candidates && data.candidates[0] && data.candidates[0].content) {
                        const parts = data.candidates[0].content.parts || [];
                        // 思考(thought)部分を除外し、純粋なテキストのみを抽出
                        const answerPart = parts.find(p => typeof p.text === 'string' && !p.thought) || parts.find(p => typeof p.text === 'string');
                        if (answerPart) { 
                            lastUsedModel = modelName;
                            return answerPart.text; 
                        }
                    }
                } catch (err) {
                    lastErrorMsg = `[${modelName}] ${err.name === 'AbortError' ? 'タイムアウト(45秒超過)' : err.message}`;
                }
            }
            throw new Error(lastErrorMsg || "API通信に失敗しました。キーや利用制限をご確認ください。");
        }

        btn.addEventListener('click', async () => {
            const apiKey = apiKeyInput.value.trim();
            const boardW = parseInt(document.getElementById('board-w').value);
            const boardH = parseInt(document.getElementById('board-h').value);
            const boardD = parseInt(depthInput.value) || 12;
            const userTopic = topicInput.value.trim() || "実用的でシンプルな木工作品";
            
            if(!apiKey) { alert('APIキーを入力してください'); return; }
            localStorage.setItem('gemini_api_key_wood', apiKey);

            btn.disabled = true;
            loading.style.display = 'block';
            resultArea.style.display = 'none';
            exportBtns.style.display = 'none';

            let sec = 0;
            const timerId = setInterval(() => { 
                sec++; 
                if(sec > 3) loadingDetail.innerText = `AI親方が図面を引き直しています...（${sec}秒経過）`;
            }, 1000);

            try {
                const promptText = `
あなたは熟練の木工職人です。
ユーザーの手元に【幅${boardW}mm × 高さ${boardH}mm × 厚み${boardD}mm】の材料が1つあります。
この材料から切り出せる、「${userTopic}」を考案してください。

【条件】
- 複雑な曲線カットは無し。直線カットのみ。
- 部材の合計面積（長さ）が、材料の90%以下になるようにすること。
- 必ず純粋なJSON文字列のみを出力すること（Markdownのバッククォート等は一切不要）。

【重要：SVG作成のルール】
- JSONパースエラーを完全に防ぐため、SVGコード内の属性は『必ずシングルクォート(')』を使用し、ダブルクォート(")は絶対に使用しないこと。
- 作品の完成形をイメージした『3Dのアイソメトリック図（鳥観図）』を描くこと。
- 立体感がわかるように面ごとに色（茶色の濃淡 #8c5e3c, #d4a373, #e6c280 等）を変えて塗りつぶすこと。

【JSONフォーマット】
{
    "title": "作品名",
    "description": "どんな作品か簡潔な説明（30文字程度）",
    "svg_icon": "<svg viewBox='0 0 200 200'>...</svg>",
    "parts": [
        {"name": "脚", "w": 450, "h": 40, "count": 4},
        {"name": "座面", "w": 300, "h": 300, "count": 1}
    ]
}`;
                const payload = {
                    contents: [{ parts: [{ text: promptText }] }],
                    generationConfig: { response_mime_type: "application/json" }
                };

                let responseText = await callGeminiWithFallback(apiKey, payload);
                responseText = responseText.replace(/```json/g, '').replace(/```/g, '').trim();
                const data = JSON.parse(responseText);

                // 結果の反映
                document.getElementById('out-title').innerText = data.title;
                document.getElementById('model-info').innerHTML = `<span class="model-badge">設計モデル: ${lastUsedModel}</span>`;
                document.getElementById('out-desc').innerText = data.description;
                document.getElementById('out-svg').innerHTML = data.svg_icon;

                const tbody = document.querySelector('#parts-table tbody');
                tbody.innerHTML = '';
                let allParts = [];

                data.parts.forEach(part => {
                    const row = `<tr>
                        <td>${part.name}</td>
                        <td>${part.w}</td>
                        <td>${part.h}</td>
                        <td>${part.count}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                    
                    for(let i=0; i<part.count; i++){
                        let fw = part.w, fh = part.h;
                        if (boardW > boardH) {
                             if (fw > fh) { [fw, fh] = [fh, fw]; }
                        } else {
                             if (fh > fw) { [fw, fh] = [fh, fw]; }
                        }
                        allParts.push({ w: fw, h: fh, name: part.name });
                    }
                });

                resultArea.style.display = 'block';
                exportBtns.style.display = 'flex';
                drawLayout(boardW, boardH, allParts);
                
            } catch (error) {
                console.error(error);
                if(error.message.includes("JSON")) {
                     alert('AI親方が図面の書き方を間違えました（JSONエラー）。\nもう一度ボタンを押してみてください！');
                } else {
                     alert('エラーが発生しました: ' + error.message);
                }
            } finally {
                clearInterval(timerId);
                btn.disabled = false;
                loading.style.display = 'none';
            }
        });

        function drawLayout(boardW, boardH, parts) {
            const canvas = document.getElementById('layout-canvas');
            if(canvas.parentElement && canvas.parentElement.clientWidth){
                const maxDisplayWidth = canvas.parentElement.clientWidth;
                let renderW = boardW;
                let renderH = boardH;
                const scale = maxDisplayWidth / renderW;
                
                canvas.width = renderW * scale;
                canvas.height = Math.max(renderH * scale, 80);
                
                const ctx = canvas.getContext('2d');
                ctx.scale(scale, scale);

                ctx.fillStyle = '#f0e6d2';
                ctx.fillRect(0, 0, renderW, renderH);
                ctx.strokeStyle = '#8c5e3c';
                ctx.lineWidth = 2 / scale;
                ctx.strokeRect(0, 0, renderW, renderH);

                parts.sort((a, b) => b.h - a.h); 

                let currentX = 0;
                let currentY = 0;
                let rowMaxH = 0;
                const KERF = 5;

                ctx.font = `${14 / scale}px Arial`;
                ctx.strokeStyle = '#c0392b'; 
                ctx.lineWidth = 2 / scale;

                parts.forEach(part => {
                    if (currentX + part.w > renderW) {
                        currentX = 0;
                        currentY += rowMaxH + KERF;
                        rowMaxH = 0;
                    }
                    if (currentY + part.h > renderH) return; 
                    
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(currentX, currentY, part.w, part.h);
                    ctx.strokeRect(currentX, currentY, part.w, part.h);
                    
                    ctx.fillStyle = '#333';
                    if(part.w * scale > 20 && part.h * scale > 10) {
                        ctx.fillText(part.name, currentX + 5, currentY + (part.h/2) + 4);
                    }

                    currentX += part.w + KERF;
                    if (part.h > rowMaxH) rowMaxH = part.h;
                });
            }
        }

        // Word出力用のSVG変換とHTML生成
        function exportToWord() {
            const title = document.getElementById('out-title').innerText;
            const desc = document.getElementById('out-desc').innerText;
            const svgEl = document.querySelector('#out-svg svg');
            const canvasEl = document.getElementById('layout-canvas');
            
            if (!title || !svgEl || !canvasEl) {
                alert("先に出力データを生成してください。");
                return;
            }

            // SVGをBase64に変換
            const svgData = new XMLSerializer().serializeToString(svgEl);
            const svgBase64 = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svgData)));
            
            // CanvasをBase64に変換
            const canvasBase64 = canvasEl.toDataURL('image/jpeg', 0.9);
            
            // テーブルHTMLの取得
            const tableHtml = document.getElementById('parts-table').outerHTML;
            const now = new Date();
            const dateStr = now.toLocaleDateString('ja-JP');

            const wordHtml = `
<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
<head>
<meta charset="utf-8">
<title>AI木工 設計図</title>
<style>
    @page { size: 210mm 297mm; margin: 15mm; }
    body { font-family: "メイリオ", sans-serif; font-size: 10.5pt; color: #222; }
    h1 { color: #1b5e20; border-bottom: 2px solid #27ae60; padding-bottom: 4px; }
    h3 { color: #8c5e3c; border-left: 4px solid #2e8b57; padding-left: 8px; margin-top: 15px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
    th, td { border: 1px solid #999; padding: 6px 8px; }
    th { background-color: #d4a373; color: white; }
    .meta { text-align: right; font-size: 9pt; color: #666; }
</style>
</head>
<body>
    <h1>${title}</h1>
    <div class="meta">作成日: ${dateStr} | ${lastUsedModel}</div>
    <p><b>${desc}</b></p>
    
    <h3>完成イメージ</h3>
    <div style="text-align: center;">
        <img src="${svgBase64}" style="max-width: 300px; height: auto;">
    </div>

    <h3>部材リスト</h3>
    ${tableHtml}

    <h3>簡易木取り図</h3>
    <div style="text-align: center;">
        <img src="${canvasBase64}" style="max-width: 100%; height: auto; border: 1px solid #333;">
    </div>
</body>
</html>`;

            const blob = new Blob(['\ufeff', wordHtml], { type: 'application/msword;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `設計図_${title}.doc`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
